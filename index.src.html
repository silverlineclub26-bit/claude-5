  <script type="text/babel" data-presets="react">
const { useReducer, useEffect, useMemo, useRef, useState } = React;

/* ============================================================
   小型 SVG 圖示（取代 lucide-react，免額外相依）
   ============================================================ */
function Svg({ size = 16, children, ...p }) {
  return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...p}>{children}</svg>;
}
const Info = (p) => <Svg {...p}><circle cx="12" cy="12" r="10" /><path d="M12 16v-4M12 8h.01" /></Svg>;
const RefreshCw = (p) => <Svg {...p}><path d="M3 12a9 9 0 0 1 15-6.7L21 8M21 3v5h-5M21 12a9 9 0 0 1-15 6.7L3 16M3 21v-5h5" /></Svg>;
const ChevronDown = (p) => <Svg {...p}><path d="m6 9 6 6 6-6" /></Svg>;
const ChevronUp = (p) => <Svg {...p}><path d="m18 15-6-6-6 6" /></Svg>;
const Coins = (p) => <Svg {...p}><circle cx="8" cy="8" r="6" /><path d="M18.09 10.37A6 6 0 1 1 10.34 18M7 6h1v4M16.71 13.88l.7.71-2.82 2.82" /></Svg>;
const Trophy = (p) => <Svg {...p}><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6M18 9h1.5a2.5 2.5 0 0 0 0-5H18M4 22h16M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22M18 2H6v7a6 6 0 0 0 12 0V2Z" /></Svg>;
const X = (p) => <Svg {...p}><path d="M18 6 6 18M6 6l12 12" /></Svg>;
const Heart = (p) => <Svg {...p}><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z" /></Svg>;

/* ============================================================
   撲克核心邏輯
   ============================================================ */
const RANKS = ['2','3','4','5','6','7','8','9','T','J','Q','K','A'];
const SUITS = ['s','h','d','c'];
const SUIT_IDX = { s: 0, h: 1, d: 2, c: 3 };
const SUIT_SYMBOL = { s: '♠', h: '♥', d: '♦', c: '♣' };
const SUIT_RED = { s: false, h: true, d: true, c: false };
const SUIT_COLOR = { s: '#eef4ff', h: '#ff5b6e', d: '#52b8ff', c: '#56d69a' };

function makeDeck() {
  const deck = [];
  for (let ri = 0; ri < RANKS.length; ri++) for (const s of SUITS) deck.push({ r: RANKS[ri], s, v: ri + 2 });
  return deck;
}
function shuffle(deck) {
  const d = deck.slice();
  for (let i = d.length - 1; i > 0; i--) { const j = (Math.random() * (i + 1)) | 0; const t = d[i]; d[i] = d[j]; d[j] = t; }
  return d;
}

/* --- 高速 7 張評估器：用位元遮罩，免 21 組合暴力比 --- */
function ranksDesc(mask) { const r = []; for (let v = 14; v >= 2; v--) if (mask & (1 << v)) r.push(v); return r; }
function straightHigh(mask) {
  let m = mask;
  if (m & (1 << 14)) m |= (1 << 1); // A 也當作 1，支援 A-2-3-4-5
  for (let hi = 14; hi >= 5; hi--) {
    let ok = true;
    for (let k = 0; k < 5; k++) if (!(m & (1 << (hi - k)))) { ok = false; break; }
    if (ok) return hi;
  }
  return 0;
}
function topN(mask, n, ...ex) {
  const out = [];
  for (let v = 14; v >= 2 && out.length < n; v--) { if (!(mask & (1 << v))) continue; if (ex.includes(v)) continue; out.push(v); }
  return out;
}
// cards: 至少 5 張、通常 7 張 {v, s}。回傳可比較的分數陣列 [類別, 決勝...]
function evalHand(cards) {
  const suitCount = [0, 0, 0, 0];
  const suitMask = [0, 0, 0, 0];
  const rankCount = new Array(15).fill(0);
  let rankMask = 0;
  for (let i = 0; i < cards.length; i++) {
    const c = cards[i], si = SUIT_IDX[c.s];
    suitCount[si]++; suitMask[si] |= (1 << c.v); rankCount[c.v]++; rankMask |= (1 << c.v);
  }
  let flushSuit = -1;
  for (let i = 0; i < 4; i++) if (suitCount[i] >= 5) flushSuit = i;
  if (flushSuit >= 0) { const sf = straightHigh(suitMask[flushSuit]); if (sf) return [8, sf]; }

  let quad = 0; const trips = [], pairs = [];
  for (let v = 14; v >= 2; v--) {
    const c = rankCount[v];
    if (c === 4) quad = v; else if (c === 3) trips.push(v); else if (c === 2) pairs.push(v);
  }
  if (quad) return [7, quad, topN(rankMask, 1, quad)[0]];
  if (trips.length >= 1 && (pairs.length >= 1 || trips.length >= 2)) {
    const three = trips[0];
    const pair = trips.length >= 2 ? trips[1] : pairs[0];
    return [6, three, pair];
  }
  if (flushSuit >= 0) return [5, ...topN(suitMask[flushSuit], 5)];
  const st = straightHigh(rankMask);
  if (st) return [4, st];
  if (trips.length >= 1) return [3, trips[0], ...topN(rankMask, 2, trips[0])];
  if (pairs.length >= 2) return [2, pairs[0], pairs[1], ...topN(rankMask, 1, pairs[0], pairs[1])];
  if (pairs.length === 1) return [1, pairs[0], ...topN(rankMask, 3, pairs[0])];
  return [0, ...topN(rankMask, 5)];
}
function cmpHand(a, b) {
  const n = Math.max(a.length, b.length);
  for (let i = 0; i < n; i++) { const x = a[i] || 0, y = b[i] || 0; if (x !== y) return x - y; }
  return 0;
}
function cardKey(c) { return c.r + c.s; }
function removeUsed(deck, used) { const keys = new Set(used.map(cardKey)); return deck.filter(c => !keys.has(cardKey(c))); }

// 蒙地卡羅勝率（已用高速評估器，可放心多跑幾次）
const FULL_DECK = makeDeck();
function equityVsN(heroCards, board, numOpp, iterations = 200) {
  if (numOpp <= 0) return { win: 1, tie: 0 };
  let wins = 0, ties = 0;
  const base = removeUsed(FULL_DECK, [...heroCards, ...board]);
  for (let it = 0; it < iterations; it++) {
    const deck = shuffle(base);
    let idx = 0;
    const opps = [];
    for (let o = 0; o < numOpp; o++) opps.push([deck[idx++], deck[idx++]]);
    const runout = board.slice();
    while (runout.length < 5) runout.push(deck[idx++]);
    const h = evalHand([...heroCards, ...runout]);
    let heroBest = true, tie = false;
    for (let o = 0; o < opps.length; o++) {
      const c = cmpHand(h, evalHand([...opps[o], ...runout]));
      if (c < 0) { heroBest = false; break; }
      if (c === 0) tie = true;
    }
    if (heroBest && !tie) wins++; else if (heroBest && tie) ties++;
  }
  return { win: wins / iterations, tie: ties / iterations };
}

/* --- Chen formula：翻前起手強度 --- */
function rankPoints(v) { if (v === 14) return 10; if (v === 13) return 8; if (v === 12) return 7; if (v === 11) return 6; return v / 2; }
function chenScore(c1, c2) {
  const v1 = Math.max(c1.v, c2.v), v2 = Math.min(c1.v, c2.v);
  const isPair = v1 === v2;
  let score = isPair ? Math.max(rankPoints(v1) * 2, 5) : rankPoints(v1);
  if (c1.s === c2.s && !isPair) score += 2;
  if (!isPair) {
    const gap = v1 - v2 - 1;
    if (gap === 1) score -= 1; else if (gap === 2) score -= 2; else if (gap === 3) score -= 4; else if (gap >= 4) score -= 5;
    if ((gap === 0 || gap === 1) && v1 <= 12) score += 1;
  }
  return Math.max(Math.ceil(score * 2) / 2, 0);
}

/* --- 位置 / 座位（N = 2,3,4）--- */
function activeSeatsFromDealer(players, dealerIdx) {

function resolvePots(players) {
  let remaining = players.filter(p => p.totalContributed > 0).map(p => ({ ...p }));
  const pots = [];
  while (remaining.length > 0) {
    const minC = Math.min(...remaining.map(p => p.totalContributed));
    const potAmount = minC * remaining.length;
    const eligible = remaining.filter(p => !p.folded).map(p => p.idx);
    pots.push({ amount: potAmount, eligible });

  }

}

/* ============================================================
   對手決策啟發式
   ============================================================ */
function baseThresholds(style) {
  return {
    open: style === 'tight' ? 8.5 : style === 'station' ? 6 : 6.5,
    call: style === 'tight' ? 7 : style === 'station' ? 3.5 : 5,
    raise: style === 'tight' ? 10 : style === 'station' ? 12 : 9,
  };
}

function villainDecide(state, pIdx) {
  const p = state.players[pIdx];
  const callAmt = state.currentBet - p.committed;
  const numOtherActive = state.players.filter((q, i) => i !== pIdx && !q.folded && !q.eliminated).length;
  const posAdj = positionAdj(p.position);
  const t = baseThresholds(p.style);
  const open = t.open + posAdj, call = t.call + posAdj * 0.6, raise = t.raise + posAdj;

  if (state.stage === 'preflop') {
    const score = chenScore(p.cards[0], p.cards[1]);
    const facingRaise = state.raiseCount > 0;
    if (!facingRaise) {
      if (score >= raise) return { type: 'raise', mult: 0.75 };
      if (score >= open) return { type: callAmt === 0 ? 'check' : 'call' };
      if (callAmt === 0) return { type: 'check' };
      return score >= call - 2 ? { type: 'call' } : { type: 'fold' };
    }
    if (score >= raise) return { type: 'raise', mult: 1 };
    if (score >= call) return { type: 'call' };
    return { type: 'fold' };
  }
  const eq = equityVsN(p.cards, state.board, numOtherActive, 120);
  const equity = eq.win + eq.tie * 0.5;
  const potOddsNeeded = callAmt > 0 ? callAmt / (state.pot + callAmt) : 0;
  if (callAmt <= 0) {
    if (equity >= 0.65 && Math.random() < valueFreq(p.style)) return { type: 'bet', mult: 0.7 };
    if (equity < 0.3 && Math.random() < bluffFreq(p.style)) return { type: 'bet', mult: 0.6 };
    return { type: 'check' };
  }
  if (equity >= potOddsNeeded + 0.2 && Math.random() < valueFreq(p.style)) return { type: 'raise', mult: 1 };
  if (equity >= potOddsNeeded + 0.03) return { type: 'call' };
  return { type: 'fold' };
}

  const N = EQ.N, E = Math.min(hero, bbStack);
  const sumSh = new Float64Array(N), sumCa = new Float64Array(N);
  const avgSh = new Float64Array(N).fill(1), avgCa = new Float64Array(N);
  const evFold = heroICMv(hero - sb, bbStack + sb, btn, payouts, 'H');
  const evShoveBBfold = heroICMv(hero + bb, bbStack - bb, btn, payouts, 'H');
  const evWin = heroICMv(hero + E, bbStack - E, btn, payouts, 'H');
  const evLose = heroICMv(hero - E, bbStack + E, btn, payouts, 'H');
  const bbEvFold = heroICMv(hero + bb, bbStack - bb, btn, payouts, 'B');
  const bbWin = heroICMv(hero - E, bbStack + E, btn, payouts, 'B');
  const bbLose = heroICMv(hero + E, bbStack - E, btn, payouts, 'B');
  for (let t = 1; t <= iters; t++) {
    const caBR = new Float64Array(N);
    for (let k = 0; k < N; k++) { const e = eqVsR(k, avgSh); caBR[k] = (e * bbWin + (1 - e) * bbLose >= bbEvFold) ? 1 : 0; }
    const pCall = wFreqE(avgCa);
    const shBR = new Float64Array(N);
    for (let h = 0; h < N; h++) { const e = eqVsR(h, avgCa); const ev = (1 - pCall) * evShoveBBfold + pCall * (e * evWin + (1 - e) * evLose); shBR[h] = (ev >= evFold) ? 1 : 0; }
    for (let k = 0; k < N; k++) { sumSh[k] += shBR[k]; sumCa[k] += caBR[k]; avgSh[k] = sumSh[k] / t; avgCa[k] = sumCa[k] / t; }
  }
  const pCall = wFreqE(avgCa);
  const shoveEdge = new Float64Array(N), callEdge = new Float64Array(N);
  for (let h = 0; h < N; h++) {
    const e = eqVsR(h, avgCa);
    shoveEdge[h] = ((1 - pCall) * evShoveBBfold + pCall * (e * evWin + (1 - e) * evLose)) - evFold;
    const ec = eqVsR(h, avgSh);
    callEdge[h] = (ec * bbWin + (1 - ec) * bbLose) - bbEvFold;
  }
  return { shove: avgSh, call: avgCa, shoveEdge, callEdge };
}

/* ============================================================
   策略引擎（Step 1）：把單一建議升級成「動作分布 + EV + 頻率」
   —— 資料合約 StrategyNode.actions = [{ key, label, ev(bb), freq }]
   —— 這是 StrategyProvider 的第一個 provider（啟發式，近似）；
      之後接真 solver（Step 3）只需換掉 ev 來源，UI / 評分不用動。
   ============================================================ */
// 用 equity + 底池幾何 + MDF 折疊權益，替每個合法動作算 EV（籌碼）
function actionEVs({ pot, callAmt, eq, heroStack, numOpp }) {
  const P = pot, c = callAmt, canCheck = c === 0;
  const acts = [];
  if (canCheck) acts.push({ key: 'check', label: '過牌', ev: eq * P });
  else {
    acts.push({ key: 'fold', label: '棄牌', ev: 0 });
    acts.push({ key: 'call', label: '跟注', ev: eq * (P + c) - c });
  }
  // 進攻動作：一個代表尺寸（下注 ⅔ 池 / 加注 ~¾ 池）
  let a = canCheck
    ? Math.round(0.66 * P)
    : c + Math.round(0.75 * (P + c));
  a = Math.min(Math.max(a, canCheck ? 1 : c + 1), heroStack); // 不超過自身籌碼
  const allin = a >= heroStack;
  const betFaced = canCheck ? a : (a - c);                 // 對手實際要跟的量
  // 折疊權益:MDF 隱含折疊率 × 0.5 折扣（避免把「詐唬垃圾牌」高估成最佳），多人再降
  let fe = 0.5 * betFaced / (P + betFaced);
  fe = Math.min(0.75, Math.max(0, Math.pow(fe, Math.max(1, numOpp))));
  const calledPot = canCheck ? (P + 2 * a) : (P + 2 * a - c);
  const evAggr = fe * P + (1 - fe) * (eq * calledPot - a);
  acts.push({ key: allin ? 'allin' : (canCheck ? 'bet' : 'raise'), label: allin ? '全下' : (canCheck ? '下注' : '加注'), ev: evAggr });
  return acts;
}
// softmax(EV) → 頻率；EV 換成 bb 單位，溫度越小策略越純
function buildStrategy(pot, callAmt, eq, heroStack, numOpp, bb) {
  const acts = actionEVs({ pot, callAmt, eq, heroStack, numOpp });
  acts.forEach(a => { a.ev = a.ev / bb; });                 // 籌碼 → bb
  const maxEV = Math.max(...acts.map(a => a.ev));
  const T = 0.6;                                            // bb；越小越接近純策略
  let sum = 0;
  acts.forEach(a => { a._w = Math.exp((a.ev - maxEV) / T); sum += a._w; });
  acts.forEach(a => { a.freq = a._w / sum; delete a._w; });
  acts.sort((x, y) => y.freq - x.freq);
  return { actions: acts, maxEV, topKey: acts[0].key, topFreq: acts[0].freq, topLabel: acts[0].label };
}
// 英雄出手 → 對應到策略裡的動作 key
function heroActionKey(decision, maxTotal) {
  if (decision.type === 'fold') return 'fold';
  if (decision.type === 'check') return 'check';
  if (decision.type === 'call') return 'call';
  if (decision.amount != null && decision.amount >= maxTotal) return 'allin';
  return decision.type === 'bet' ? 'bet' : 'raise';
}
// 依 GTO Wizard 指標評分：evLoss（bb）+ 該點頻率
function scoreHeroAction(strategy, key, bb) {
  let act = strategy.actions.find(a => a.key === key);
  if (!act) {
    const aggr = ['bet', 'raise', 'allin'];
    act = aggr.includes(key)
      ? strategy.actions.find(a => aggr.includes(a.key))
      : strategy.actions.find(a => a.key === 'check' || a.key === 'call' || a.key === 'fold');
  }
  if (!act) return { evLoss: 0, heroFreq: 0 };
  return { evLoss: Math.max(0, strategy.maxEV - act.ev), heroFreq: act.freq };
}

function computeAdvice(state) {
  if (!state.actingOrder || state.actingOrder.length === 0) return null;
  const actorIdx = state.actingOrder[state.actIdxPtr % state.actingOrder.length];
  if (actorIdx !== 0) return null;
  const hero = state.players[0];
  if (!hero.cards || hero.cards.length < 2) return null;
  const callAmt = state.currentBet - hero.committed;
  const oppsIn = state.players.filter((q, i) => i !== 0 && !q.folded && !q.eliminated);
  const numOpp = oppsIn.length;
  const bb = state.bb;

  if (state.stage === 'preflop') {
    const code = handCode(hero.cards);
    const pct = HAND_PCT[code];
    const topPct = Math.max(1, Math.round(pct * 100));
    const pos = hero.position;
    const eq = equityVsN(hero.cards, [], numOpp, 140);
    const eqFloat = eq.win + eq.tie * 0.5;
    const equity = Math.round(eqFloat * 100);
    const strategy = buildStrategy(state.pot, callAmt, eqFloat, hero.stack, numOpp, bb);
    const oppStacks = oppsIn.map(o => o.stack + o.committed);
    const effBB = (oppStacks.length ? Math.min(hero.stack + hero.committed, Math.max(...oppStacks)) : hero.stack) / bb;
    const facingRaise = state.raiseCount > 0;
    let action, reasoning;

    // Step 3：短碼且單挑（HU）→ 用真 Nash 推/棄表（精確）
    if (effBB <= 15 && PUSHFOLD && numOpp === 1) {
      const pf = pushFoldNode(effBB, code, facingRaise);
      if (pf) {
        reasoning = `有效 ${effBB.toFixed(1)}bb 單挑 · ${facingRaise ? '面對全下' : '短碼首入'}：${code} → Nash「${pf.topLabel}」（${Math.round(pf.topFreq * 100)}%）。真 solver 解。`;
        return { action: pf.topLabel, rangePct: topPct, equity, reasoning, position: pos, numOpp, effBB: Math.round(effBB), strategy: pf, bb };
      }
    }

    if (effBB <= 12) {
      const thr = pushThreshold(pos, effBB, facingRaise);
      if (pct <= thr) { action = '全下 All-in'; reasoning = `有效籌碼僅 ${effBB.toFixed(1)}bb，屬短碼推/棄。${code} 落在 ${pos} 推牌範圍（前 ${Math.round(thr * 100)}%）內，直接全下最佳。`; }
      else { action = callAmt === 0 ? '過牌' : '棄牌'; reasoning = `有效籌碼 ${effBB.toFixed(1)}bb，${code}（前 ${topPct}%）未達 ${pos} 短碼推牌門檻（前 ${Math.round(thr * 100)}%），${callAmt === 0 ? '過牌看牌' : '棄牌'}為佳。`; }
      return { action, rangePct: topPct, equity, reasoning, position: pos, numOpp, effBB: Math.round(effBB), strategy, bb };
    }

    // Step 2：一般深度改用範圍表（有此情境的範圍就用，否則退回 Step 1 EV 引擎）
    if (hasChart(pos, facingRaise)) {
      const chart = preflopStrategyNode(pos, facingRaise, code);
      const spot = facingRaise ? '面對加注' : '開池';
      reasoning = chart.topKey === 'fold'
        ? `${pos} ${spot}：${code} 不在${facingRaise ? '續戰' : '開池'}範圍內，棄牌。（近似範圍表，Step 3 接真 solver 更準）`
        : `${pos} ${spot}：${code} 落在「${chart.topLabel}」範圍。（近似範圍表，Step 3 接真 solver 更準）`;
      return { action: chart.topLabel, rangePct: topPct, equity, reasoning, position: pos, numOpp, effBB: Math.round(effBB), strategy: chart, bb };
    }

    if (!facingRaise) {
      const openP = OPEN_PCT[pos] ?? 0.4;
      if (pct <= openP) { action = pos === 'BB' && callAmt === 0 ? '加注（隔離）' : '加注（open）'; reasoning = `${pos} 位置，${code} 落在前 ${topPct}%，在開池範圍（前 ${Math.round(openP * 100)}%）內，主動加注建立主動權。`; }
      else { action = callAmt === 0 ? '過牌' : '棄牌'; reasoning = `${pos} 位置，${code}（前 ${topPct}%）超出開池範圍（前 ${Math.round(openP * 100)}%），${callAmt === 0 ? '過牌免費看翻牌' : '棄牌'}。`; }
    } else {
      const tb = THREEBET_PCT[pos] ?? 0.06, cp = CALL_PCT[pos] ?? 0.2;
      if (pct <= tb) { action = '3-bet 加注'; reasoning = `面對加注，${code}（前 ${topPct}%）落在 ${pos} 的價值 3-bet 範圍（前 ${Math.round(tb * 100)}%），再加注施壓。`; }
      else if (pct <= cp) { action = '跟注'; reasoning = `面對加注，${code}（前 ${topPct}%）在 ${pos} 跟注範圍（前 ${Math.round(cp * 100)}%），跟注看翻牌。`; }
      else { action = '棄牌'; reasoning = `面對加注，${code}（前 ${topPct}%）超出 ${pos} 續戰範圍（跟注前 ${Math.round(cp * 100)}%），棄牌。`; }
    }
    return { action, rangePct: topPct, equity, reasoning, position: pos, numOpp, effBB: Math.round(effBB), strategy, bb };
  }

  // 翻後：對對手推測範圍算勝率
  const cutoffs = oppsIn.map(o => oppCutoff(o, bb));
  const eq = equityVsRange(hero.cards, state.board, cutoffs, 300);
  const eqFloat = eq.win + eq.tie * 0.5;
  const equity = Math.round(eqFloat * 100);
  const strategy = buildStrategy(state.pot, callAmt, eqFloat, hero.stack, numOpp, bb);
  const potOddsNeeded = callAmt > 0 ? Math.round((callAmt / (state.pot + callAmt)) * 100) : 0;
  const readTag = numOpp === 1 ? (cutoffs[0] <= 0.25 ? '（對手動作偏強、範圍收窄）' : cutoffs[0] <= 0.45 ? '（對手範圍中等）' : '（對手範圍偏寬）') : `（對 ${numOpp} 位推測範圍）`;
  let action, reasoning;
  if (callAmt <= 0) {
    if (equity >= 62) { const size = Math.round((state.pot * 0.66) / 10) * 10; const mdf = Math.round((1 - 0.66 / 1.66) * 100); action = '下注（價值 ⅔ 池）'; reasoning = `${readTag}勝率約 ${equity}%，領先明顯，主動下注約 ${size}（⅔ 池）拿價值；對手需防守 MDF ≈ ${mdf}%。`; }
    else { action = '過牌'; reasoning = `${readTag}勝率約 ${equity}%，不足以下注拿價值，過牌控池較穩健。`; }
  } else {
    if (equity >= potOddsNeeded + 18) { action = '加注（價值）'; reasoning = `${readTag}勝率 ${equity}% 遠高於所需底池賠率 ${potOddsNeeded}%，加注放大價值。`; }
    else if (equity >= potOddsNeeded + 2) { action = '跟注'; reasoning = `${readTag}勝率 ${equity}% 高於所需底池賠率 ${potOddsNeeded}%，跟注為正期望值。`; }
    else { action = '棄牌'; reasoning = `${readTag}勝率 ${equity}% 低於所需底池賠率 ${potOddsNeeded}%，長期負期望，建議棄牌。`; }
  }
  return { action, equity, potOddsNeeded, callAmt, pot: state.pot, reasoning, position: hero.position, numOpp, strategy, bb };
}

const initialState = {
  screen: 'lobby', mode: 'cash', handNum: 0, dealerIdx: 0,
  sb: 50, bb: 100, ante: 0,
  players: [],
  board: [], deck: [], pot: 0, stage: 'idle',
  actingOrder: [], actIdxPtr: 0, currentBet: 0, lastRaiserIdx: null, raiseCount: 0, lastRaiseSize: 0,
  feed: [], history: [], decisionLog: [], lastReview: null,
  finishOrder: [], gameOver: false, winners: [], showAdvice: false, trainingStyle: 'challenge',
  stats: { hands: 0, decisions: 0, evLoss: 0, buckets: {} },

function makePlayers() {
  const styles = ['tight', 'loose', 'station'];
  const base = { stack: STARTING_STACK, cards: [], folded: false, allIn: false, committed: 0, totalContributed: 0, hasActed: false, eliminated: false, position: '', aggro: 0 };
  return [
    { idx: 0, name: '你', isHero: true, style: null, ...base },
    { idx: 1, name: '對手A', isHero: false, style: styles[0], ...base },
    { idx: 2, name: '對手B', isHero: false, style: styles[1], ...base },
    { idx: 3, name: '對手C', isHero: false, style: styles[2], ...base },
  ];
}

function startNewHand(state) {
  if (state.mode === 'tournament') {
    const heroP = state.players[0];
    if (heroP && heroP.eliminated) return { ...state, stage: 'gameover', gameOver: true };
    const activeCount = state.players.filter(p => !p.eliminated).length;
    if (state.handNum > 0 && activeCount === 1) return { ...state, stage: 'gameover', gameOver: true, placement: 1 };
  }
  const handNum = state.handNum + 1;
  const { sb, bb, ante } = blindsForHand(state.mode, handNum);

  let dealerIdx;
  if (state.handNum === 0) dealerIdx = state.players.findIndex(p => !p.eliminated);
  else { let d = (state.dealerIdx + 1) % 4; while (state.players[d].eliminated) d = (d + 1) % 4; dealerIdx = d; }

  let players = state.players.map(p => ({ ...p, cards: [], folded: p.eliminated, allIn: false, committed: 0, totalContributed: 0, hasActed: false, position: '', aggro: 0 }));
  let deck = shuffle(makeDeck());
  let cursor = 0;
  for (const p of players) { if (!p.eliminated) { p.cards = [deck[cursor], deck[cursor + 1]]; cursor += 2; } }
  deck = deck.slice(cursor);

  const seats = activeSeatsFromDealer(players, dealerIdx);
  const labels = roleLabels(seats.length);
  seats.forEach((seatIdx, i) => { players[seatIdx].position = labels[i]; });

  let pot = 0;
  const feed = [`— 第 ${handNum} 手（${seats.length} 人桌）—`];
  if (ante > 0) {
    for (const p of players) { if (p.eliminated) continue; const a = Math.min(ante, p.stack); p.stack -= a; pot += a; p.totalContributed += a; }
    feed.push(`每位玩家投入前注 ${ante}`);
  }
  const n = seats.length;
  const sbSeat = n === 2 ? seats[0] : seats[1];
  const bbSeat = n === 2 ? seats[1] : seats[2];
  const sbPay = Math.min(sb, players[sbSeat].stack);
  const bbPay = Math.min(bb, players[bbSeat].stack);
  players[sbSeat].stack -= sbPay; players[sbSeat].committed = sbPay; players[sbSeat].totalContributed += sbPay;
  if (players[sbSeat].stack === 0) players[sbSeat].allIn = true;
  players[bbSeat].stack -= bbPay; players[bbSeat].committed = bbPay; players[bbSeat].totalContributed += bbPay;
  if (players[bbSeat].stack === 0) players[bbSeat].allIn = true;
  pot += sbPay + bbPay;
  feed.push(`${players[sbSeat].name}（小盲）投入 ${sbPay}，${players[bbSeat].name}（大盲）投入 ${bbPay}`);

  const orders = actionOrders(seats);
  const actingOrder = orders.preflop.filter(i => !players[i].eliminated && !players[i].allIn);

  return {
    ...state, handNum, sb, bb, ante, dealerIdx, players, deck, board: [], pot,
    stage: 'preflop', actingOrder, actIdxPtr: 0, currentBet: bbPay, lastRaiserIdx: bbSeat, raiseCount: 0, lastRaiseSize: bbPay,
    feed, decisionLog: [], lastReview: null, screen: 'table', winners: [],
  };
}

function findNextActor(state) {
  const order = state.actingOrder;
  let i = state.actIdxPtr;
  for (let step = 0; step < order.length; step++) {
    i = (i + 1) % order.length;
    const p = state.players[order[i]];
    if (!p.folded && !p.allIn) return i;
  }
  return null;
}
function isRoundComplete(state) {
  const contenders = state.players.filter(p => !p.folded && !p.eliminated);
  if (contenders.length <= 1) return true;
  const decisionMakers = contenders.filter(p => !p.allIn);
  if (decisionMakers.length === 0) return true;
  return decisionMakers.every(p => p.hasActed && p.committed === state.currentBet);
}
function dealStreetCards(deck, board, stage) {
  if (stage === 'preflop') return { board: [...board, deck[0], deck[1], deck[2]], deck: deck.slice(3), newStage: 'flop' };
  if (stage === 'flop') return { board: [...board, deck[0]], deck: deck.slice(1), newStage: 'turn' };
  if (stage === 'turn') return { board: [...board, deck[0]], deck: deck.slice(1), newStage: 'river' };
  return { board, deck, newStage: 'showdown' };
}
function advanceStreet(state) {
  const contenders = state.players.filter(p => !p.folded && !p.eliminated);
  if (contenders.length <= 1 || state.stage === 'river') return resolveHand(state);

  const { board, deck, newStage } = dealStreetCards(state.deck, state.board, state.stage);
  const players = state.players.map(p => ({ ...p, committed: 0, hasActed: p.folded || p.eliminated || p.allIn }));
  const label = newStage === 'flop' ? '翻牌' : newStage === 'turn' ? '轉牌' : '河牌';
  const shown = board.slice(newStage === 'flop' ? 0 : board.length - 1).map(c => c.r + SUIT_SYMBOL[c.s]).join(' ');
  const feed = [...state.feed, `— ${label}：${shown} —`];

  const decisionMakers = players.filter(p => !p.folded && !p.eliminated && !p.allIn);
  if (decisionMakers.length <= 1) {
    return advanceStreet({ ...state, board, deck, stage: newStage, players, feed, currentBet: 0, lastRaiserIdx: null, raiseCount: 0, lastRaiseSize: state.bb });
  }
  const seats = activeSeatsFromDealer(players, state.dealerIdx);
  const orders = actionOrders(seats);
  const actingOrder = orders.postflop.filter(i => !players[i].folded && !players[i].eliminated && !players[i].allIn);

  return { ...state, board, deck, stage: newStage, players, feed, currentBet: 0, lastRaiserIdx: null, raiseCount: 0, lastRaiseSize: state.bb, actingOrder, actIdxPtr: 0 };
}
function coachReview(preState, finalPlayers) {
  const log = preState.decisionLog;
  if (log.length === 0) return ['這手你沒有輪到需要決策的時刻。'];
  const lines = [];
  const totalLoss = log.reduce((s, d) => s + (d.evLoss || 0), 0);
  const mistakes = log.filter(d => (d.evLoss || 0) >= 0.3).sort((a, b) => b.evLoss - a.evLoss);
  if (mistakes.length === 0) {
    lines.push(`這手每個決策都很接近 GTO，總 EV 損失僅 ≈ ${totalLoss.toFixed(1)}bb，紀律掌握得不錯。`);
  } else {
    for (const d of mistakes.slice(0, 3)) {
      lines.push(`${d.streetLabel}（${d.position}）：你選「${d.heroLabel}」（該點頻率約 ${d.heroFreqPct}%），GTO 主要走「${d.topLabel}」（約 ${d.topFreqPct}%），此決策 EV 損失 ≈ ${d.evLoss.toFixed(1)}bb。${d.reasoning}`);
    }
    lines.push(`本手總 EV 損失 ≈ ${totalLoss.toFixed(1)}bb —— 以「每個決策少丟 EV」為目標，別在意單手輸贏。`);
  }
  return lines;
}
function resolveHand(state) {
  const contenders = state.players.filter(p => !p.folded && !p.eliminated);
  let players = state.players.map(p => ({ ...p }));
  let resultLines = [];
  let winners = [];

  if (contenders.length === 1) {
    const w = contenders[0];
    players[w.idx].stack += state.pot; winners = [w.idx];
    resultLines.push(`${w.name} 未攤牌贏得 ${state.pot} 籌碼（其餘玩家棄牌）`);
  } else {
    const potInputs = state.players.filter(p => p.totalContributed > 0).map(p => ({ idx: p.idx, totalContributed: p.totalContributed, folded: p.folded }));
    const pots = resolvePots(potInputs);
    for (const pot of pots) {
      if (pot.eligible.length === 0) continue;
      if (pot.eligible.length === 1) { players[pot.eligible[0]].stack += pot.amount; winners.push(pot.eligible[0]); resultLines.push(`${players[pot.eligible[0]].name} 獨得 ${pot.amount} 邊池`); continue; }
      const hands = pot.eligible.map(idx => ({ idx, score: evalHand([...state.players[idx].cards, ...state.board]) }));
      hands.sort((a, b) => cmpHand(b.score, a.score));
      const best = hands[0].score;
      const potWinners = hands.filter(h => cmpHand(h.score, best) === 0).map(h => h.idx);
      const share = Math.floor(pot.amount / potWinners.length);
      let remainder = pot.amount - share * potWinners.length;
      for (const w of potWinners) { players[w].stack += share + (remainder > 0 ? 1 : 0); if (remainder > 0) remainder--; winners.push(w); }
      resultLines.push(`底池 ${pot.amount}：${potWinners.map(w => players[w].name).join(' / ')} 獲勝`);
    }
  }

  let finishOrder = [...state.finishOrder];
  if (state.mode === 'tournament') {
    for (const p of players) { if (!p.eliminated && p.stack <= 0) { p.eliminated = true; finishOrder.push(p.idx); } }
  } else {
    for (const p of players) { if (p.stack <= 0) p.stack = STARTING_STACK; }
  }

  const review = coachReview(state, players);
  const history = [...state.history, {
    handNum: state.handNum,
    hero: state.players[0].cards.map(c => c.r + SUIT_SYMBOL[c.s]).join(' '),
    board: state.board.map(c => c.r + SUIT_SYMBOL[c.s]).join(' '),
    pot: state.pot, result: resultLines.join('；'), decisions: state.decisionLog, review,
  }];

  // 統計：EV 損失（bb）
  const lossSum = state.decisionLog.reduce((s, d) => s + (d.evLoss || 0), 0);
  const buckets = { ...(state.stats.buckets || {}) };
  for (const d of state.decisionLog) {
    const key = `${d.streetLabel} · ${d.position}`;
    const b = buckets[key] || { n: 0, mistakes: 0, evLoss: 0 };
    buckets[key] = { n: b.n + 1, mistakes: b.mistakes + (d.evLoss >= 0.3 ? 1 : 0), evLoss: b.evLoss + (d.evLoss || 0) };
  }
  const stats = { hands: state.stats.hands + 1, decisions: state.stats.decisions + state.decisionLog.length, evLoss: state.stats.evLoss + lossSum, buckets };

  return { ...state, players, history, stage: 'handover', lastReview: review, finishOrder, winners, stats, feed: [...state.feed, ...resultLines] };
}
function amountFor(mult, pot, maxTotal) { if (mult === 'allin') return maxTotal; return Math.min(Math.round(pot * mult / 10) * 10, maxTotal); }

function applyAction(state, decision) {
  const order = state.actingOrder;
  const actorIdx = order[state.actIdxPtr % order.length];
  const p = state.players[actorIdx];
  let players = state.players.map(q => ({ ...q }));
  let pot = state.pot, feed = [...state.feed], currentBet = state.currentBet, lastRaiserIdx = state.lastRaiserIdx, raiseCount = state.raiseCount, lastRaiseSize = state.lastRaiseSize;
  let decisionLog = state.decisionLog;

  if (actorIdx === 0) {
    const advice = computeAdvice(state);
    if (advice && advice.strategy) {
      const maxTotal = p.stack + p.committed;
      const isAllin = decision.amount != null && decision.amount >= maxTotal;
      const key = heroActionKey(decision, maxTotal);
      const { evLoss, heroFreq } = scoreHeroAction(advice.strategy, key, state.bb);
      const label = decision.type === 'fold' ? '棄牌' : decision.type === 'check' ? '過牌' : decision.type === 'call' ? '跟注' : isAllin ? '全下' : decision.type === 'raise' ? '加注' : '下注';
      decisionLog = [...decisionLog, {
        streetLabel: state.stage === 'preflop' ? '翻前' : state.stage === 'flop' ? '翻牌' : state.stage === 'turn' ? '轉牌' : '河牌',
        position: p.position, heroLabel: label, heroFreqPct: Math.round(heroFreq * 100),
        topLabel: advice.strategy.topLabel, topFreqPct: Math.round(advice.strategy.topFreq * 100),
        evLoss, reasoning: advice.reasoning,
      }];
    }
  }

  const callAmt = currentBet - p.committed;
  if (decision.type === 'fold') { players[actorIdx].folded = true; players[actorIdx].hasActed = true; feed.push(`${p.name} 棄牌`); }
  else if (decision.type === 'check') { players[actorIdx].hasActed = true; feed.push(`${p.name} 過牌`); }
  else if (decision.type === 'call') {
    const pay = Math.min(callAmt, players[actorIdx].stack);
    players[actorIdx].stack -= pay; players[actorIdx].committed += pay; players[actorIdx].totalContributed += pay;
    if (players[actorIdx].stack === 0) players[actorIdx].allIn = true;
    players[actorIdx].hasActed = true; pot += pay;
    feed.push(`${p.name} 跟注 ${pay}${players[actorIdx].allIn ? '（all-in）' : ''}`);
  } else if (decision.type === 'bet' || decision.type === 'raise') {
    const maxTotal = players[actorIdx].stack + players[actorIdx].committed;
    let targetTotal = decision.amount != null ? decision.amount : amountFor(decision.mult, Math.max(pot, state.bb * 2), maxTotal);
    const minRaiseTo = Math.min(currentBet + Math.max(lastRaiseSize, state.bb), maxTotal);
    let newCommit = Math.max(targetTotal, minRaiseTo);
    newCommit = Math.min(newCommit, maxTotal);
    const pay = newCommit - players[actorIdx].committed;
    const raiseSize = newCommit - currentBet;
    players[actorIdx].stack -= pay; players[actorIdx].committed = newCommit; players[actorIdx].totalContributed += pay;
    if (players[actorIdx].stack === 0) players[actorIdx].allIn = true;
    players[actorIdx].hasActed = true; pot += pay; currentBet = newCommit; lastRaiserIdx = actorIdx; raiseCount += 1;
    players[actorIdx].aggro = (players[actorIdx].aggro || 0) + 1;
    if (raiseSize > 0) lastRaiseSize = raiseSize;
    for (const q of players) { if (q.idx !== actorIdx && !q.folded && !q.eliminated && !q.allIn) q.hasActed = false; }
    feed.push(`${p.name} ${decision.type === 'bet' ? '下注' : '加注'} 至 ${newCommit}${players[actorIdx].allIn ? '（all-in）' : ''}`);
  }

  let newState = { ...state, players, pot, feed, currentBet, lastRaiserIdx, raiseCount, lastRaiseSize, decisionLog };
  const contenders = players.filter(q => !q.folded && !q.eliminated);
  if (contenders.length <= 1) return resolveHand(newState);
  if (isRoundComplete(newState)) return advanceStreet(newState);
  const nextPtr = findNextActor(newState);
  if (nextPtr === null) return advanceStreet(newState);
  return { ...newState, actIdxPtr: nextPtr };
}

function reducer(state, action) {
  switch (action.type) {
    case 'START_SESSION':
      return startNewHand({ ...initialState, players: makePlayers(), mode: action.mode, trainingStyle: action.trainingStyle, showAdvice: action.trainingStyle === 'guided', stats: { hands: 0, decisions: 0, evLoss: 0, buckets: {} } });
    case 'NEW_HAND':
      if (state.mode === 'cash' && state.players[0].stack <= 0) return { ...state, stage: 'gameover', gameOver: true };
      return startNewHand(state);
    case 'REBUY':
      return startNewHand({ ...state, players: state.players.map(p => ({ ...p, stack: STARTING_STACK, eliminated: false })), gameOver: false, finishOrder: [], handNum: 0, dealerIdx: 0 });
    case 'TO_LOBBY': return { ...initialState, trainingStyle: state.trainingStyle };
    case 'TOGGLE_ADVICE': return { ...state, showAdvice: !state.showAdvice };
    case 'HERO_ACT': {
      const order = state.actingOrder;
      const actorIdx = order[state.actIdxPtr % order.length];
      if (actorIdx !== 0) return state;
      return applyAction(state, action.decision);
    }
    case 'BOT_ACT': {
      const order = state.actingOrder;
      const actorIdx = order[state.actIdxPtr % order.length];
      if (actorIdx === 0 || actorIdx === undefined) return state;
      return applyAction(state, villainDecide(state, actorIdx));
    }
    default: return state;
  }
}

    </div>
  );
}

/* 可調加注控制器 */
function BetControl({ stage, pot, bb, currentBet, heroCommitted, heroStack, lastRaiseSize, onBet }) {
  const maxTotal = heroStack + heroCommitted;
  const minRaiseTo = Math.min(currentBet + Math.max(lastRaiseSize, bb), maxTotal);
  const [amount, setAmount] = useState(minRaiseTo);
  const [open, setOpen] = useState(false);

  useEffect(() => { setAmount(minRaiseTo); }, [minRaiseTo, stage, pot]);

  const isRaise = currentBet > 0;
  const label = stage === 'preflop' ? '加注' : isRaise ? '加注' : '下注';
  const type = stage === 'preflop' ? 'raise' : (isRaise ? 'raise' : 'bet');

  const presets = stage === 'preflop'
    ? [
        { k: '2.5bb', total: Math.round(bb * 2.5) },
        { k: '3bb', total: bb * 3 },
        { k: currentBet > bb ? '3-bet ×3' : '4bb', total: currentBet > bb ? currentBet * 3 : bb * 4 },
      ].map(x => ({ ...x, total: Math.max(Math.min(x.total, maxTotal), minRaiseTo) }))
    : [
        { k: '⅓池', v: Math.round((pot / 3) / 10) * 10 },
        { k: '⅔池', v: Math.round((pot * 2 / 3) / 10) * 10 },
        { k: '滿池', v: pot },
      ].map(x => ({ ...x, total: Math.max(Math.min(currentBet + x.v, maxTotal), minRaiseTo) }));

  const clamp = (v) => Math.max(minRaiseTo, Math.min(maxTotal, Math.round(v / 10) * 10));

  if (maxTotal <= currentBet) return null; // 無法再加注

  if (!open) return (
    <button onClick={() => setOpen(true)} className="vivid-action vivid-raise tap-target flex-1 min-w-[5rem] rounded-lg text-sm font-semibold whitespace-nowrap px-2">
      {label} ⋯
    </button>
  );
  return (
    <div className="bright-panel w-full rounded-lg p-3 space-y-2.5">
      <div className="flex items-center justify-between">
        <span className="text-slate-400 text-xs">{label}至</span>
        <span className="text-white font-bold" style={{ fontFamily: "'JetBrains Mono', monospace" }}>{amount.toLocaleString()}</span>
      </div>
      <input type="range" className="w-full" min={minRaiseTo} max={maxTotal} step={10} value={amount} onChange={e => setAmount(clamp(Number(e.target.value)))} />
      <div className="grid grid-cols-4 gap-1.5">
        {presets.map(p => (
          <button key={p.k} onClick={() => setAmount(clamp(p.total))} className="tap-target rounded-lg border border-amber-700/60 text-amber-300 text-[11px] px-1">{p.k}</button>
        ))}
        <button onClick={() => setAmount(maxTotal)} className="tap-target rounded-lg border border-rose-600/70 text-rose-300 text-[11px] px-1">All-in</button>
      </div>
      <div className="grid grid-cols-2 gap-2 pt-0.5">
        <button onClick={() => setOpen(false)} className="tap-target rounded-lg border border-stone-600 text-stone-300 text-sm">取消</button>
        <button onClick={() => { onBet(type, amount); setOpen(false); }} className="tap-target rounded-lg bg-amber-600 text-slate-950 text-sm font-semibold">
          {amount >= maxTotal ? 'All-in' : `${label} ${amount}`}
        </button>
      </div>
    </div>
  );
}

/* ============================================================
   短碼 Drill：發題→出招→即時 EV 計分→追蹤弱點（用 chip-EV 推/棄 Nash 資料）
   ============================================================ */
function stackBucket(E) { return E <= 6 ? '≤6bb' : E <= 9 ? '7-9bb' : E <= 12 ? '10-12bb' : '13-15bb'; }
function DrillMode({ onExit }) {
  const [ready, setReady] = useState(!!PUSHFOLD);
  const [spot, setSpot] = useState(null);
  const [result, setResult] = useState(null);
  const [stats, setStats] = useState({ n: 0, correct: 0, evLoss: 0, buckets: {} });
  const [streak, setStreak] = useState(0);

  useEffect(() => {
    if (PUSHFOLD) { setReady(true); return; }
    fetch('pushfold-ranges.json').then(r => r.json()).then(d => { d.codeIndex = {}; d.codes.forEach((c, i) => { d.codeIndex[c] = i; }); PUSHFOLD = d; setReady(true); }).catch(() => { });
  }, []);

  const newSpot = (similarTo = null) => {
    const stacks = PUSHFOLD.stacks;
    const candidates = similarTo ? stacks.filter(E => stackBucket(E) === stackBucket(similarTo.E)) : stacks;
    const E = candidates[(Math.random() * candidates.length) | 0];
    const facing = similarTo ? similarTo.facing : Math.random() < 0.5; // 同類重練保留情境與籌碼區間
    const deck = shuffle(makeDeck());
    const cards = [deck[0], deck[1]];
    return { E, facing, cards, code: handCode(cards) };
  };
  useEffect(() => { if (ready && !spot) setSpot(newSpot()); }, [ready, spot]);

  const answer = (aggressive) => {
    if (result) return;
    const i = PUSHFOLD.codeIndex[spot.code], t = PUSHFOLD.tables[spot.E];
    const freq = (spot.facing ? t.call[i] : t.shove[i]) / 100;       // 該做進攻動作的頻率
    const edge = (spot.facing ? t.callEdge[i] : t.shoveEdge[i]) / 100; // 進攻相對棄牌的 EV(bb)
    const heroEV = aggressive ? edge : 0, bestEV = Math.max(edge, 0);
    const evLoss = Math.max(0, bestEV - heroEV);
    const correct = evLoss < 0.1;
    const bestAction = edge >= 0 ? (spot.facing ? '跟注' : '全下') : '棄牌';
    const mixed = freq > 0.15 && freq < 0.85;
    let reasoning = spot.facing
      ? (edge >= 0
        ? '跟注沒有「逼對手棄牌」的好處，只能純比勝率——你的牌對上對手全下範圍，勝率足以支付底池賠率，所以該跟。'
        : '關鍵觀念：面對全下要比直覺更緊！你沒有籌碼壓力能逼退對手，純比勝率，而這手贏不過對手範圍 → 棄。')
      : (edge >= 0
        ? `${spot.E}bb 短碼首入：全下常直接拿走盲注(fold equity)，被跟時也還有勝率。籌碼越短、盲注相對越大，全下範圍越寬。`
        : `這手不夠強：被跟時勝率不足，而 ${spot.E}bb 還沒短到「隨便都能推」。棄牌保留籌碼，等更好的牌或位置。`);
    if (mixed) reasoning += `（進攻頻率 ${Math.round(freq * 100)}% 屬臨界手——GTO 是混合打法，兩種選擇都接近正確，別糾結單一手。）`;
    const errorType = correct ? null : aggressive ? '範圍過鬆：把應棄牌的邊緣牌打得太積極' : '範圍過緊：錯過可獲利的進攻或跟注';
    setResult({ correct, evLoss, freq, bestAction, edge, reasoning, errorType });
    setStreak(s => correct ? s + 1 : 0);
    setStats(s => {
      const key = (spot.facing ? '面對全下' : '首入') + ' · ' + stackBucket(spot.E);
      const b = s.buckets[key] || { n: 0, evLoss: 0 };
      return { n: s.n + 1, correct: s.correct + (correct ? 1 : 0), evLoss: s.evLoss + evLoss, buckets: { ...s.buckets, [key]: { n: b.n + 1, evLoss: b.evLoss + evLoss } } };
    });
  };
  const next = () => { setResult(null); setSpot(newSpot()); };
  const retrySimilar = () => { const previous = spot; setResult(null); setSpot(newSpot(previous)); };

  const acc = stats.n ? Math.round((stats.correct / stats.n) * 100) : 0;
  const avgLoss = stats.n ? (stats.evLoss / stats.n) : 0;
  const worst = Object.entries(stats.buckets).filter(([, b]) => b.n >= 3).sort((a, b) => (b[1].evLoss / b[1].n) - (a[1].evLoss / a[1].n))[0];

  return (
    <div className="training-shell px-3 py-4" style={{ fontFamily: "'Inter', sans-serif" }}>
      <div className="max-w-md mx-auto space-y-3">
        <div className="training-bar rounded-lg flex items-center justify-between px-3 py-2">
          <div>
            <h1 className="font-bold text-lg text-white" style={{ fontFamily: "'Noto Serif TC', serif" }}>短碼推棄</h1>
            <p className="text-white/70 text-xs">單挑 · Nash 即時判分</p>
          </div>
          <button onClick={onExit} aria-label="返回大廳" className="close-button text-stone-500 hover:text-stone-200"><X size={18} /></button>
        </div>

        {!ready || !spot ? <p className="text-stone-500 text-sm py-8 text-center">載入 Nash 資料中…</p> : (
          <>
            <div className="felt training-felt rounded-lg p-4 flex flex-col items-center gap-3">
              <p className="text-stone-300 text-sm">
                有效 <span className="text-amber-300 font-bold" style={{ fontFamily: "'JetBrains Mono', monospace" }}>{spot.E}bb</span> · 單挑 ·
                {spot.facing ? ' 對手全下，你要…' : ' 輪到你首入，要…'}
              </p>
              <div className="flex gap-1.5 py-1">
                {spot.cards.map((c, i) => <CardFace key={i} card={c} size="lg" />)}
              </div>
            </div>

            {!result ? (
              <div className="action-dock sticky bottom-2 z-20 grid grid-cols-2 gap-2 rounded-lg border border-white/10 bg-[#0b0d11]/95 p-1.5 shadow-2xl">
                <button onClick={() => answer(false)} className="vivid-action vivid-fold tap-target rounded-lg px-3 text-sm font-semibold">棄牌</button>
                <button onClick={() => answer(true)} className="vivid-action vivid-raise tap-target rounded-lg px-3 text-sm font-semibold">{spot.facing ? '跟注全下' : '全下'}</button>
              </div>
            ) : (
              <div className="space-y-2">
                <div className={`rounded-xl border px-4 py-3 ${result.correct ? 'border-teal-700/60 bg-teal-950/40' : 'border-rose-700/60 bg-rose-950/40'}`}>
                  <p className={`font-semibold text-sm ${result.correct ? 'text-teal-300' : 'text-rose-300'}`}>{result.correct ? '✓ 正確' : '✗ 偏離 GTO'}</p>
                  {result.errorType && <p className="mt-1.5 rounded-md bg-rose-950/60 px-2.5 py-2 text-xs font-medium text-rose-200">錯誤方向：{result.errorType}</p>}
                  <p className="text-stone-200 text-sm mt-1">GTO：<span className="text-amber-300 font-bold">{result.bestAction}</span>（該點進攻頻率 {Math.round(result.freq * 100)}%） · 你這手 EV 損失 ≈ <span style={{ fontFamily: "'JetBrains Mono', monospace" }}>{result.evLoss.toFixed(2)}bb</span></p>
                  <p className="text-teal-100/70 text-xs mt-1.5 leading-relaxed">{result.reasoning}</p>
                </div>
                <div className="action-dock sticky bottom-2 z-20 grid grid-cols-2 gap-2 rounded-lg border border-white/10 bg-[#0b0d11]/95 p-1.5 shadow-2xl">
                  {!result.correct && <button onClick={retrySimilar} className="tap-target rounded-lg border border-teal-600 text-teal-200 px-2 text-sm font-semibold">同類再練</button>}
                  <button onClick={next} className={`tap-target rounded-lg bg-amber-500 hover:bg-amber-400 text-slate-950 font-semibold px-3 ${result.correct ? 'col-span-2' : ''}`}>下一題</button>
                </div>
              </div>
            )}

            <div className="rounded-xl border border-stone-700/50 bg-slate-900/60 px-4 py-2.5 space-y-1">
              <div className="flex items-center justify-between text-xs">
                <span className="text-stone-300 font-medium">已練 {stats.n} 題</span>
                <span className="text-teal-300" style={{ fontFamily: "'JetBrains Mono', monospace" }}>連對 {streak} · 正確率 {acc}%</span>
              </div>
              {worst && <p className="text-rose-300/80 text-[11px]">最弱環節：{worst[0]}（平均丟 {(worst[1].evLoss / worst[1].n).toFixed(2)}bb，{worst[1].n} 題）</p>}
            </div>
            <p className="text-stone-600 text-[10px] text-center">單挑推/棄為真 Nash 精算（chip-EV）。ICM 版與更多情境陸續加入。</p>
          </>
        )}
      </div>
    </div>
  );
}

/* ICM 短碼 Drill：3人決賽桌，隨機配置即時解 ICM 推/棄，用獎金池% 計分 */
const ICM_PAYOUTS = [[50, 30, 20], [45, 30, 25], [60, 25, 15]];
function ICMDrillMode({ onExit }) {
  const [ready, setReady] = useState(!!EQ);
  const [spot, setSpot] = useState(null);
  const [result, setResult] = useState(null);
  const [stats, setStats] = useState({ n: 0, correct: 0, evLoss: 0, buckets: {} });
  const [streak, setStreak] = useState(0);
  const rint = (lo, hi) => lo + ((Math.random() * (hi - lo + 1)) | 0);

  useEffect(() => {
    if (EQ) { setReady(true); return; }
    fetch('eqtable.json').then(r => r.json()).then(d => { loadEQ(d); setReady(true); }).catch(() => { });
  }, []);

  const newSpot = (similarTo = null) => {
    const facing = similarTo ? similarTo.facing : Math.random() < 0.5;
    let heroS = rint(5, 13);
    if (similarTo) { while (stackBucket(heroS) !== stackBucket(similarTo.heroS)) heroS = rint(5, 13); }
    const villS = rint(5, 13), btnS = rint(8, 25);
    const payouts = similarTo ? similarTo.payouts : ICM_PAYOUTS[(Math.random() * ICM_PAYOUTS.length) | 0];
    // facing=false → 你是SB(shover)：solve(hero, vill, btn)；facing=true → 你是BB(caller)：solve(vill, hero, btn)
    const sol = facing ? solveICMapp(villS, heroS, btnS, 0.5, 1, payouts) : solveICMapp(heroS, villS, btnS, 0.5, 1, payouts);
    const deck = shuffle(makeDeck());
    const cards = [deck[0], deck[1]];
    return { facing, heroS, villS, btnS, payouts, sol, cards, code: handCode(cards) };
  };
  useEffect(() => { if (ready && !spot) setSpot(newSpot()); }, [ready, spot]);

  const answer = (aggressive) => {
    if (result) return;
    const i = EQ.codeIndex[spot.code];
    const freq = spot.facing ? spot.sol.call[i] : spot.sol.shove[i];
    const edge = spot.facing ? spot.sol.callEdge[i] : spot.sol.shoveEdge[i]; // ICM$（獎金池%）
    const heroEV = aggressive ? edge : 0, bestEV = Math.max(edge, 0);
    const evLoss = Math.max(0, bestEV - heroEV);
    const correct = evLoss < 0.15;
    const bestAction = edge >= 0 ? (spot.facing ? '跟注' : '全下') : '棄牌';
    const mixed = freq > 0.15 && freq < 0.85;
    let reasoning = spot.facing
      ? (edge >= 0 ? '面對全下只能純比勝率(沒有 fold equity)。這手對上對手範圍勝率夠 → 跟。'
        : '面對全下要很緊：純比勝率、又要承擔出局風險，這手贏不過對手範圍 → 棄。')
      : (edge >= 0 ? '短碼首入能直接拿走盲注(fold equity)，可推得寬。'
        : '這手被跟時勝率不足，首入全下不划算 → 棄。');
    reasoning += `　▶ ICM 關鍵：決賽桌出局＝掉獎金階梯，所以${spot.facing ? '跟注' : '推/跟'}都要比 chip-EV 更緊——同一手牌在現金桌可能該推、決賽桌卻該棄。`;
    const minS = Math.min(spot.villS, spot.btnS);
    if (minS <= 7) reasoning += `這桌有人只剩 ${minS}bb 快出局，ICM 壓力更大，更該讓對手先冒險出局。`;
    if (mixed) reasoning += `（進攻頻率 ${Math.round(freq * 100)}% 屬臨界混合手，兩種都接近正確。）`;
    const errorType = correct ? null : aggressive ? 'ICM 過鬆：低估出局成本與獎金階梯壓力' : 'ICM 過緊：這個籌碼配置仍允許你施壓';
    setResult({ correct, evLoss, freq, bestAction, reasoning, errorType });
    setStreak(s => correct ? s + 1 : 0);
    setStats(s => {
      const key = (spot.facing ? '面對全下' : '首入') + ' · ' + stackBucket(spot.heroS);
      const b = s.buckets[key] || { n: 0, evLoss: 0 };
      return { n: s.n + 1, correct: s.correct + (correct ? 1 : 0), evLoss: s.evLoss + evLoss, buckets: { ...s.buckets, [key]: { n: b.n + 1, evLoss: b.evLoss + evLoss } } };
    });
  };
  const next = () => { setResult(null); setSpot(newSpot()); };
  const retrySimilar = () => { const previous = spot; setResult(null); setSpot(newSpot(previous)); };
  const acc = stats.n ? Math.round((stats.correct / stats.n) * 100) : 0;
  const avgLoss = stats.n ? (stats.evLoss / stats.n) : 0;
  const worst = Object.entries(stats.buckets).filter(([, b]) => b.n >= 3).sort((a, b) => (b[1].evLoss / b[1].n) - (a[1].evLoss / a[1].n))[0];

  return (
    <div className="training-shell px-3 py-4" style={{ fontFamily: "'Inter', sans-serif" }}>
      <div className="max-w-md mx-auto space-y-3">
        <div className="training-bar rounded-lg flex items-center justify-between px-3 py-2">
          <div>
            <h1 className="font-bold text-lg text-white" style={{ fontFamily: "'Noto Serif TC', serif" }}>決賽桌 ICM</h1>
            <p className="text-white/70 text-xs">3 人桌 · 獎金池即時判分</p>
          </div>
          <button onClick={onExit} aria-label="返回大廳" className="close-button text-stone-500 hover:text-stone-200"><X size={18} /></button>
        </div>
        {!ready || !spot ? <p className="text-stone-500 text-sm py-8 text-center">載入勝率表 / 求解中…</p> : (
          <>
            <div className="felt training-felt rounded-lg p-4 flex flex-col items-center gap-2">
              <p className="text-stone-400 text-[11px]">決賽桌 3 人 · 獎金 {spot.payouts.join('/')}（%獎池）</p>
              <p className="text-stone-300 text-sm text-center" style={{ fontFamily: "'JetBrains Mono', monospace" }}>
                你 <span className="text-amber-300 font-bold">{spot.heroS}bb</span> · 對手 {spot.villS}bb · BTN {spot.btnS}bb
              </p>
              <p className="text-stone-200 text-sm">{spot.facing ? '你在 BB，對手全下 → 你要…' : '你在 SB 首入 → 要…'}</p>
              <div className="flex gap-1.5 py-1">{spot.cards.map((c, i) => <CardFace key={i} card={c} size="lg" />)}</div>
            </div>
            {!result ? (
              <div className="action-dock sticky bottom-2 z-20 grid grid-cols-2 gap-2 rounded-lg border border-white/10 bg-[#0b0d11]/95 p-1.5 shadow-2xl">
                <button onClick={() => answer(false)} className="vivid-action vivid-fold tap-target rounded-lg px-3 text-sm font-semibold">棄牌</button>
                <button onClick={() => answer(true)} className="vivid-action vivid-raise tap-target rounded-lg px-3 text-sm font-semibold">{spot.facing ? '跟注全下' : '全下'}</button>
              </div>
            ) : (
              <div className="space-y-2">
                <div className={`rounded-xl border px-4 py-3 ${result.correct ? 'border-teal-700/60 bg-teal-950/40' : 'border-rose-700/60 bg-rose-950/40'}`}>
                  <p className={`font-semibold text-sm ${result.correct ? 'text-teal-300' : 'text-rose-300'}`}>{result.correct ? '✓ 正確' : '✗ 偏離 ICM-GTO'}</p>
                  {result.errorType && <p className="mt-1.5 rounded-md bg-rose-950/60 px-2.5 py-2 text-xs font-medium text-rose-200">錯誤方向：{result.errorType}</p>}
                  <p className="text-stone-200 text-sm mt-1">ICM 建議：<span className="text-amber-300 font-bold">{result.bestAction}</span>（進攻頻率 {Math.round(result.freq * 100)}%） · EV 損失 ≈ <span style={{ fontFamily: "'JetBrains Mono', monospace" }}>{result.evLoss.toFixed(2)}%</span> 獎池</p>
                  <p className="text-teal-100/70 text-xs mt-1.5 leading-relaxed">{result.reasoning}</p>
                </div>
                <div className="action-dock sticky bottom-2 z-20 grid grid-cols-2 gap-2 rounded-lg border border-white/10 bg-[#0b0d11]/95 p-1.5 shadow-2xl">
                  {!result.correct && <button onClick={retrySimilar} className="tap-target rounded-lg border border-teal-600 text-teal-200 px-2 text-sm font-semibold">同類再練</button>}
                  <button onClick={next} className={`tap-target rounded-lg bg-amber-500 hover:bg-amber-400 text-slate-950 font-semibold px-3 ${result.correct ? 'col-span-2' : ''}`}>下一題</button>
                </div>
              </div>
            )}
            <div className="rounded-xl border border-stone-700/50 bg-slate-900/60 px-4 py-2.5 space-y-1">
              <div className="flex items-center justify-between text-xs">
                <span className="text-stone-300 font-medium">已練 {stats.n} 題</span>
                <span className="text-teal-300" style={{ fontFamily: "'JetBrains Mono', monospace" }}>連對 {streak} · 正確率 {acc}%</span>
              </div>
              {worst && <p className="text-rose-300/80 text-[11px]">最弱環節：{worst[0]}（平均丟 {(worst[1].evLoss / worst[1].n).toFixed(2)}%，{worst[1].n} 題）</p>}
            </div>
            <p className="text-stone-600 text-[10px] text-center">3人決賽桌 SB推/BB跟 · 瀏覽器即時 ICM 精算（Nash）。每題隨機配置。</p>
          </>
        )}
      </div>
    </div>
  );
}

function PreviewCard({ rank, suit, back, tilt = 0 }) {
  const red = suit === '♥' || suit === '♦';
  return <div className={`preview-card ${back ? 'back' : ''}`} style={{ transform: `rotate(${tilt}deg)` }}>
    {back ? <span>SL</span> : <><span className={red ? 'text-rose-600' : 'text-stone-900'}>{rank}</span><span className={red ? 'text-rose-600' : 'text-stone-900'}>{suit}</span></>}
  </div>;
}

function Lobby({ onStart, onDrill, onICM, showAdvice }) {
  const [mode, setMode] = useState('cash');
  const [trainingStyle, setTrainingStyle] = useState('challenge');
  return (
    <div className="lobby-shell px-3 pb-8 pt-3" style={{ fontFamily: "'Inter', sans-serif" }}>
      <div className="max-w-md w-full mx-auto space-y-4">
        <header className="vivid-header flex items-end p-4">
          <div className="relative z-10">
            <span className="vivid-kicker">Silver Line Poker Lab</span>
            <h1 className="lobby-title mt-2 text-[30px] font-bold leading-tight text-white">銀線陪練桌</h1>
            <p className="mt-1 text-xs font-medium text-white/75">每一手，都比上一手更準。</p>
          </div>
          <div className="absolute right-3 top-3 z-10 flex items-center gap-1.5 rounded-full bg-white px-2 py-1 text-[9px] font-bold text-[#17191d]"><span className="h-1.5 w-1.5 rounded-full bg-teal-500" /> ENGINE ON</div>
        </header>

        <div className="lobby-table -mt-7" aria-label="四人撲克訓練桌預覽">
          <span className="seat-dot left-1/2 top-4 -translate-x-1/2">AI</span>
          <span className="seat-dot left-4 top-1/2 -translate-y-1/2">AI</span>
          <span className="seat-dot right-4 top-1/2 -translate-y-1/2">AI</span>
          <div className="absolute left-1/2 top-[44%] -translate-x-1/2 -translate-y-1/2">
            <div className="flex items-center justify-center gap-1">
              <PreviewCard rank="K" suit="♦" tilt={-2} /><PreviewCard rank="7" suit="♣" /><PreviewCard rank="2" suit="♥" tilt={2} />
            </div>
            <div className="mt-2 text-center"><span className="preview-chip">POT 650</span></div>
          </div>
          <div className="absolute bottom-3 left-1/2 -translate-x-1/2 text-center">
            <div className="flex justify-center -space-x-1"><PreviewCard rank="A" suit="♠" tilt={-4} /><PreviewCard rank="K" suit="♠" tilt={4} /></div>
            <span className="mt-1 inline-block rounded-full bg-black/55 px-2 py-0.5 text-[9px] font-semibold text-amber-200">YOU · BTN</span>
          </div>
        </div>

        <section className="space-y-2.5">
          <div className="flex items-center justify-between px-1"><p className="text-xs font-bold text-[#17191d]">開始一局</p><span className="text-[10px] font-medium text-[#656b69]">4 人桌 · AI 對手</span></div>
          <div className="vivid-control space-y-2.5 p-3">
            <div className="vivid-segment grid grid-cols-2 gap-1 rounded-lg p-1" role="tablist" aria-label="賽制模式">
              <button onClick={() => setMode('cash')} className={`tap-target rounded-md text-sm font-semibold transition ${mode === 'cash' ? 'vivid-segment-active' : 'text-[#656b69]'}`}>現金桌</button>
              <button onClick={() => setMode('tournament')} className={`tap-target rounded-md text-sm font-semibold transition ${mode === 'tournament' ? 'vivid-segment-active' : 'text-[#656b69]'}`}>錦標賽</button>
            </div>
            <div className="grid grid-cols-2 gap-1" role="tablist" aria-label="學習方式">
              <button onClick={() => setTrainingStyle('challenge')} className={`tap-target rounded-md border px-2 text-left ${trainingStyle === 'challenge' ? 'vivid-answer-active' : 'border-transparent text-[#737875]'}`}>
                <b className="block text-xs">先作答</b><span className="block mt-0.5 text-[10px] font-normal opacity-70">覆盤才揭曉答案</span>
              </button>
              <button onClick={() => setTrainingStyle('guided')} className={`tap-target rounded-md border px-2 text-left ${trainingStyle === 'guided' ? 'vivid-answer-active' : 'border-transparent text-[#737875]'}`}>
                <b className="block text-xs">教練陪打</b><span className="block mt-0.5 text-[10px] font-normal opacity-70">決策前可看提示</span>
              </button>
            </div>
            <div className="flex items-center justify-between px-1 text-xs">
              <span className="text-[#656b69]">{mode === 'cash' ? '固定盲注 · 隨時重新買入' : '盲注遞增 · 淘汰賽制'}</span>
              <span className="font-bold text-[#17191d]" style={{ fontFamily: "'JetBrains Mono', monospace" }}>{mode === 'cash' ? '50 / 100' : 'LEVEL UP'}</span>
            </div>
            <button onClick={() => onStart(mode, trainingStyle)} className="vivid-primary tap-target w-full rounded-lg font-bold px-4 flex items-center justify-between transition">
              <span className="flex items-center gap-2"><span className="text-base">♠</span> 發牌，開始訓練</span><span aria-hidden="true">→</span>
            </button>
          </div>
        </section>

        <section className="space-y-2">
          <div className="flex items-center justify-between px-1"><p className="text-xs font-bold text-[#17191d]">快速特訓</p><span className="text-[10px] font-medium text-[#656b69]">即時判分</span></div>
          <div className="grid grid-cols-2 gap-2">
            <button onClick={onDrill} className="vivid-drill teal tap-target rounded-lg p-3 text-left transition">
              <span className="icon-well border border-[#17191d] bg-white/70 text-[#17191d]"><RefreshCw size={18} /></span>
              <b className="mt-3 block text-sm">短碼推棄</b><span className="block mt-0.5 text-[10px] opacity-65">Nash EV · 同類重練</span>
            </button>
            <button onClick={onICM} className="vivid-drill blue tap-target rounded-lg p-3 text-left transition">
              <span className="icon-well border border-[#17191d] bg-white/70 text-[#17191d]"><Trophy size={18} /></span>
              <b className="mt-3 block text-sm">決賽桌 ICM</b><span className="block mt-0.5 text-[10px] opacity-65">獎金階梯 · 出局壓力</span>
            </button>
          </div>
        </section>
      </div>
    </div>
  );
}

function App() {
  const [state, dispatch] = useReducer(reducer, initialState);
  const botTimer = useRef(null);
  const [pfReady, setPfReady] = useState(!!PUSHFOLD);
  const [inDrill, setInDrill] = useState(false);
  const [inICM, setInICM] = useState(false);

  // 載入短碼推/棄 Nash 表（Step 3）：部署時與 index.html 同目錄
  useEffect(() => {
    if (PUSHFOLD) { setPfReady(true); return; }
    fetch('pushfold-ranges.json').then(r => r.json()).then(d => {
      d.codeIndex = {}; d.codes.forEach((c, i) => { d.codeIndex[c] = i; });
      PUSHFOLD = d; setPfReady(true);
    }).catch(() => { });
  }, []);

  const order = state.actingOrder;
  const actorIdx = order && order.length > 0 ? order[state.actIdxPtr % order.length] : undefined;

  useEffect(() => {
    if (!['preflop', 'flop', 'turn', 'river'].includes(state.stage)) return;
    if (actorIdx !== 0 && actorIdx !== undefined) {
      // 你已棄牌/出局→這手對你已結束，快轉剩下的機器人流程，直接跳到教練覆盤＋下一手
      const heroOut = state.players[0] && (state.players[0].folded || state.players[0].eliminated);
      const delay = heroOut ? 60 : 900 + Math.random() * 600;
      botTimer.current = setTimeout(() => dispatch({ type: 'BOT_ACT' }), delay);
      return () => clearTimeout(botTimer.current);
    }
  }, [state.actIdxPtr, state.actingOrder, state.stage, actorIdx]);

  const advice = useMemo(() => computeAdvice(state), [state.actIdxPtr, state.actingOrder, state.stage, state.board.length, state.pot, state.currentBet, state.raiseCount, pfReady]);

  if (inDrill) return <DrillMode onExit={() => setInDrill(false)} />;
  if (inICM) return <ICMDrillMode onExit={() => setInICM(false)} />;
  if (state.screen === 'lobby') return <Lobby onStart={(mode, trainingStyle) => dispatch({ type: 'START_SESSION', mode, trainingStyle })} onDrill={() => setInDrill(true)} onICM={() => setInICM(true)} showAdvice={state.showAdvice} />;

  const activeCount = state.players.filter(p => !p.eliminated).length;
  const level = state.mode === 'tournament' ? Math.min(Math.floor(state.handNum / HANDS_PER_LEVEL), TOURNEY_SCHEDULE.length - 1) + 1 : null;
  const heroActive = actorIdx === 0 && ['preflop', 'flop', 'turn', 'river'].includes(state.stage);
  const hero = state.players[0];
  const callAmt = heroActive ? Math.max(state.currentBet - hero.committed, 0) : 0;
  const canCheck = callAmt === 0;
  const showdownReveal = state.stage === 'handover';
  const oppSeat = (i) => (
    <Seat player={state.players[i]} isHero={false}
      showCards={showdownReveal && !state.players[i].folded && !state.players[i].eliminated}
      isActor={actorIdx === i && !showdownReveal}
      isWinner={showdownReveal && state.winners.includes(i)} animate={state.stage === 'preflop'} />
  );

  return (
    <div className="training-shell px-3 py-3" style={{ fontFamily: "'Inter', sans-serif" }}>
      <div className="max-w-md mx-auto space-y-3 pb-3">
        <div className="training-bar rounded-lg flex items-center justify-between px-3 py-2">
          <div>
            <h1 className="font-bold text-lg text-white" style={{ fontFamily: "'Noto Serif TC', serif" }}>銀線陪練桌</h1>
            <p className="text-white/70 text-xs">
              {state.mode === 'tournament' ? `錦標賽 · Level ${level}（${state.sb}/${state.bb}${state.ante ? `，前注 ${state.ante}` : ''}） · ${activeCount} 人桌` : `現金桌 · 盲注 ${state.sb}/${state.bb} · ${activeCount} 人桌`}
            </p>
          </div>
          <button onClick={() => dispatch({ type: 'TO_LOBBY' })} aria-label="返回大廳" className="close-button text-stone-500 hover:text-stone-200"><X size={18} /></button>
        </div>

        <div className="felt training-felt training-table px-3 py-4">
          {/* 四人直立桌：座位沿桌緣配置，中央只保留公共牌與底池。 */}
          <div className="table-seat table-seat-top">{oppSeat(2)}</div>
          <div className="table-seat table-seat-left">{oppSeat(1)}</div>
          <div className="table-seat table-seat-right">{oppSeat(3)}</div>

          <div className="table-center flex flex-col items-center gap-2">
            <div className="flex gap-1 min-h-[3.2rem]">
              {state.board.map((c, i) => <CardFace key={c.r + c.s} card={c} size="md" animate />)}
              {Array.from({ length: 5 - state.board.length }).map((_, i) => <div key={i} className="w-12 h-[4.25rem] rounded-md border border-dashed border-sky-300/20 bg-slate-950/10" />)}
            </div>
            <div key={state.pot} className="flex items-center gap-1.5 text-amber-400 text-sm font-medium pot-pulse"><Coins size={14} /> 底池 {state.pot.toLocaleString()}</div>
          </div>

          <div className="table-seat table-seat-hero">
            <Seat player={hero} isHero={true} showCards={true}
              isActor={heroActive} isWinner={showdownReveal && state.winners.includes(0)} animate={state.stage === 'preflop'} />
          </div>
        </div>

        <ActionFeed feed={state.feed} />

        {heroActive && (
          <div className="action-dock sticky bottom-2 z-20 flex flex-wrap gap-2 rounded-lg p-2">
            <button onClick={() => dispatch({ type: 'HERO_ACT', decision: { type: 'fold' } })} className="vivid-action vivid-fold tap-target flex-1 min-w-[4rem] rounded-lg text-sm font-semibold whitespace-nowrap px-2">棄牌</button>
            <button onClick={() => dispatch({ type: 'HERO_ACT', decision: { type: canCheck ? 'check' : 'call' } })} className="vivid-action vivid-call tap-target flex-1 min-w-[4rem] rounded-lg text-sm font-semibold whitespace-nowrap px-2">{canCheck ? '過牌' : `跟注 ${callAmt}`}</button>
            <BetControl stage={state.stage} pot={state.pot} bb={state.bb} currentBet={state.currentBet} heroCommitted={hero.committed} heroStack={hero.stack} lastRaiseSize={state.lastRaiseSize}
              onBet={(type, amount) => dispatch({ type: 'HERO_ACT', decision: { type, amount } })} />
          </div>
        )}

        {state.trainingStyle === 'guided' ? (
          <AdvicePanel advice={heroActive ? advice : null} show={state.showAdvice} onToggle={() => dispatch({ type: 'TOGGLE_ADVICE' })} />
        ) : heroActive ? (
          <div className="rounded-lg border border-amber-400/20 bg-amber-400/[.04] px-3 py-2.5 text-xs text-stone-400 flex items-center gap-2">
            <Heart size={14} className="text-amber-300" /><span><b className="text-stone-200">先作答模式</b> · 建議與 EV 會在本手覆盤揭曉</span>
          </div>
        ) : null}

        {heroActive && state.stage === 'preflop' && advice && advice.strategy && advice.strategy.evIsProxy && (
          <PreflopRangeGrid pos={hero.position} facingRaise={state.raiseCount > 0} heroCode={handCode(hero.cards)} />
        )}

        {state.stage === 'gameover' ? (
          <div className="rounded-xl border border-rose-800/50 bg-rose-950/40 p-4 text-center space-y-3">
            <p className="text-rose-300 font-semibold">
              {state.mode === 'tournament'
                ? (state.players[0].eliminated ? `錦標賽結束，你在 4 人中拿下第 ${4 - state.finishOrder.indexOf(0)} 名` : '恭喜奪得本場冠軍！')
                : (hero.stack <= 0 ? '你破產了' : '對局結束')}
            </p>
            {state.mode === 'cash' ? (
              <button onClick={() => dispatch({ type: 'REBUY' })} className="rounded-lg bg-amber-500 text-slate-950 font-semibold px-4 py-2 text-sm">重新買入，繼續練習</button>
            ) : (
              <button onClick={() => dispatch({ type: 'TO_LOBBY' })} className="rounded-lg bg-amber-500 text-slate-950 font-semibold px-4 py-2 text-sm">返回大廳</button>
            )}
          </div>
        ) : state.stage === 'handover' ? (
          <div className="space-y-3">
            <ReviewPanel lines={state.lastReview} />
            <button onClick={() => dispatch({ type: 'NEW_HAND' })} className="w-full rounded-lg bg-amber-500 hover:bg-amber-400 text-slate-950 font-semibold py-3 flex items-center justify-center gap-2">
              <RefreshCw size={16} /> 下一手
            </button>
          </div>
        ) : heroActive ? null : (
          <div className="text-center text-stone-500 text-sm py-2">{state.players[actorIdx]?.name || '對手'} 思考中…</div>
        )}

        {state.stats.hands > 0 && <StatBar stats={state.stats} />}
        <HandHistory history={state.history} />
        <PostflopSpotViewer />
        <p className="text-stone-700 text-[10px] text-center pt-1">個人練習用途 · 非真錢賭博</p>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
